name: weatherornot
description: "Weather or Not - Mobile Wardrobe Management App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.3
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  http: ^1.2.0
  geolocator: ^14.0.0
  provider: ^6.0.0
  intl: ^0.20.2
  table_calendar: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  image_path: "assets/Weather.png"
  web:
    generate: true
  android: true
  ios: true

flutter:
  uses-material-design: true
  assets:
      - assets/
      - assets/stations.json